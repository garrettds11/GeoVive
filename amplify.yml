version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - config.js
      - manifest.json
      - browserconfig.xml
      - "CSS template.css"
      - assets/**/*
      - scripts/**/*
  cache:
    paths:
      - node_modules/**/*