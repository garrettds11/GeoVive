<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GeoBoard – Starter Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Mapbox GL JS CSS & GEOCODER assets -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" />

  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --panel-bg: #020617;
      --accent1: #22c55e;
      --accent2: #e9da0e;
      --accent3: #2284c58e;
      --accent4: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.12);
      --accent-strong: rgba(34, 197, 94, 0.25);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e293b 0, #020617 40%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #020617, #030712);
    }

    header h1 {
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    header span {
      font-weight: 600;
      color: var(--accent);
    }

    .badge {
      padding: 0.2rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      background: rgba(15, 23, 42, 0.9);
      font-size: 0.75rem;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 0;
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }
    }

    /* Sidebar */
    .sidebar {
      background: radial-gradient(circle at top, #020617 0, #020617 40%, #000 100%);
      border-right: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (max-width: 850px) {
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }

    .sidebar h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .sidebar .hint {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .filter-group {
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), #020617);
      padding: 0.75rem 0.75rem 0.5rem;
    }

    .filter-group h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }

    .filter-option input {
      accent-color: var(--accent3);
    }

    .filter-option label {
      font-size: 0.85rem;
      color: var(--text);
    }

    .legend {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-right: 0.6rem;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .legend-swatch.events { background: #22c55e; }
    .legend-swatch.locations { background: #3b82f6; }
    .legend-swatch.alerts { background: #f97316; }

    .feature-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.25rem;
      margin-top: 0.25rem;
    }

    .feature-list-item {
      padding: 0.55rem 0.55rem;
      margin-bottom: 0.4rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(31, 41, 55, 0.9);
      background: radial-gradient(circle at top left, #020617 0, #020617 50%, #020617 100%);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }

    .feature-list-item:hover {
      border-color: var(--accent-strong);
      background: radial-gradient(circle at top left, #022c22 0, #020617 40%, #020617 100%);
      transform: translateY(-1px);
    }

    .feature-name {
      font-weight: 600;
      color: var(--text);
    }

    .feature-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Map container */
    #map {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .map-wrapper {
      position: relative;
      min-height: 0;
    }

    /* Map overlay / status */
    .map-status {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      align-items: flex-end;
    }

    .status-pill {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.75rem;
      color: var(--muted);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.65);
    }

    .mapboxgl-popup {
      max-width: 240px;
      font-size: 0.8rem;
    }

    .mapboxgl-popup-content {
      border-radius: 0.75rem;
      padding: 0.75rem 0.9rem;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
    }

    .popup-title {
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .popup-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .popup-desc {
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1><span>GeoBoard</span> · Mapbox + OSM Starter</h1>
    <div style="display:flex; align-items:center; gap:0.75rem;">
        <label style="font-size:0.8rem; color:#9ca3af;">
        Style:
        <select id="style-select" style="background:#020617; color:#e5e7eb; border:1px solid #1f2937; border-radius:999px; padding:0.15rem 0.5rem; font-size:0.8rem;">
            <option value="streets">Streets</option>
            <option value="outdoors">Outdoors</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="satellite">Satellite</option>
        </select>
        </label>
        <div class="badge">v0.1 · local demo</div>
    </div>
  </header>

  <main>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div>
        <h2>Layers & Filters</h2>
        <p class="hint">
          Pan around the map, click points to inspect them, or select an item in this list to fly to it.
        </p>
      </div>

      <div class="filter-group">
        <h3>Show categories</h3>
        <div class="filter-option">
          <input type="checkbox" id="filter-events" value="event" checked />
          <label for="filter-events">Events</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="filter-locations" value="location" checked />
          <label for="filter-locations">Locations</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="filter-alerts" value="alert" checked />
          <label for="filter-alerts">Alerts</label>
        </div>

        <div class="legend">
          <div class="legend-item">
            <span class="legend-swatch events"></span> Events
          </div>
          <div class="legend-item">
            <span class="legend-swatch locations"></span> Locations
          </div>
          <div class="legend-item">
            <span class="legend-swatch alerts"></span> Alerts
          </div>
        </div>
      </div>

      <div class="filter-group" style="margin-top: 0.5rem;">
        <h3>Dataset</h3>
        <select id="dataset-select" style="width:100%; background:#020617; color:#e5e7eb; border:1px solid #1f2937; border-radius:0.5rem; padding:0.35rem 0.5rem; font-size:0.85rem;">
            <option value="demo">Demo points (built-in)</option>
            <option value="csv">Custom CSV (local file)</option>
            <option value="osm">OSM GeoJSON file</option>
            <!-- later: <option value="dynamo">Live from DynamoDB</option> -->
        </select>
        <p class="hint" style="margin-top:0.4rem;">
            Choose which dataset GeoBoard displays.
        </p>
        <br>
        <h3>Features</h3>
        <div id="feature-list" class="feature-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </aside>

    <!-- Map -->
    <section class="map-wrapper">
      <div id="map"></div>
      <div class="map-status">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Mapbox connected</span>
        </div>
        <div class="status-pill" id="status-zoom">
          Zoom: <span id="zoom-value">–</span>
        </div>
      </div>
    </section>
  </main>

<script>
  // 1. Mapbox token
  mapboxgl.accessToken = "pk.eyJ1IjoiZ3doaXoiLCJhIjoiY21pNHc4cXFuMjI2MzJqbXowZDFybGdvYiJ9.syxHOGayNBn3ZEnKr-8KVg";

  // 2. Map styles
  const MAP_STYLES = {
    streets: "mapbox://styles/mapbox/streets-v12",
    outdoors: "mapbox://styles/mapbox/outdoors-v12",
    light: "mapbox://styles/mapbox/light-v11",
    dark: "mapbox://styles/mapbox/dark-v11",
    satellite: "mapbox://styles/mapbox/satellite-streets-v12"
  };

  // 3. Base dataset (demo points) – define BEFORE we reference it
  const geoboardData = {
    type: "FeatureCollection",
    features: [
      {
        type: "Feature",
        properties: {
          id: "evt-1",
          name: "Security Summit",
          category: "event",
          description: "Regional cybersecurity meetup and roundtable."
        },
        geometry: {
          type: "Point",
          coordinates: [-96.7969, 32.7763]
        }
      },
      {
        type: "Feature",
        properties: {
          id: "loc-1",
          name: "Escape Go Workshop",
          category: "location",
          description: "Small-batch puzzle kit assembly shop."
        },
        geometry: {
          type: "Point",
          coordinates: [-93.7321, 32.5159]
        }
      },
      {
        type: "Feature",
        properties: {
          id: "alrt-1",
          name: "Weather Watch",
          category: "alert",
          description: "Heads-up: strong storms possible this weekend."
        },
        geometry: {
          type: "Point",
          coordinates: [-90.0715, 29.9511]
        }
      },
      {
        type: "Feature",
        properties: {
          id: "loc-2",
          name: "VulnServer Lab Node",
          category: "location",
          description: "Experimental lab node for training environments."
        },
        geometry: {
          type: "Point",
          coordinates: [-122.3321, 47.6062]
        }
      }
    ]
  };

  // Category → color
  const categoryColor = {
    event: "#22c55e",
    location: "#3b82f6",
    alert: "#f97316"
  };

  // 4. Dataset plumbing
  let currentDataset = "demo";
  let demoDataset = geoboardData;

  const OSM_DATA_URL = "data/osm-places.geojson";
  const CSV_DATA_URL = "data/custom-places.csv";

  function csvToGeoJSON(csvText) {
    const lines = csvText.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());

    const features = lines
      .slice(1)
      .filter(line => line.trim())
      .map(line => {
        const cells = line.split(",").map(v => v.trim());
        const row = {};
        headers.forEach((h, i) => (row[h] = cells[i]));

        const lat = parseFloat(row.lat);
        const lng = parseFloat(row.lng);

        return {
          type: "Feature",
          properties: {
            id: row.id || `${row.name}-${lat}-${lng}`,
            name: row.name,
            category: row.category || "location",
            description: row.description || ""
          },
          geometry: {
            type: "Point",
            coordinates: [lng, lat]
          }
        };
      });

    return { type: "FeatureCollection", features };
  }

  async function loadDataset(key) {
    currentDataset = key;

    if (key === "demo") return demoDataset;

    if (key === "osm") {
      const res = await fetch(OSM_DATA_URL);
      return await res.json();
    }

    if (key === "csv") {
      const res = await fetch(CSV_DATA_URL);
      const text = await res.text();
      return csvToGeoJSON(text);
    }

    if (key === "dynamo") {
      const res = await fetch("/api/geoboard"); // your API
      return await res.json();                  // should already be GeoJSON
    }

    return demoDataset;
  }

  // 5. Map init
  const map = new mapboxgl.Map({
    container: "map",
    style: MAP_STYLES.streets,
    center: [-96.9, 32.8],
    zoom: 3.5
  });

  // Zoom overlay
  const zoomValueEl = document.getElementById("zoom-value");
  map.on("zoom", () => {
    zoomValueEl.textContent = map.getZoom().toFixed(2);
  });
  map.on("load", () => {
    zoomValueEl.textContent = map.getZoom().toFixed(2);
  });

  // Helper to ensure our layer exists (used both on first load + style changes)
  function ensurePointLayer() {
    if (!map.getLayer("geoboard-layer")) {
      map.addLayer({
        id: "geoboard-layer",
        type: "circle",
        source: "geoboard-points",
        paint: {
          "circle-radius": 7,
          "circle-color": [
            "match",
            ["get", "category"],
            "event", categoryColor.event,
            "location", categoryColor.location,
            "alert", categoryColor.alert,
            "#e5e7eb"
          ],
          "circle-stroke-width": 1.5,
          "circle-stroke-color": "#020617",
          "circle-opacity": 0.9
        }
      });
    }
  }

  async function applyDataset(key) {
    const geojson = await loadDataset(key);

    if (!map.getSource("geoboard-points")) {
      map.addSource("geoboard-points", {
        type: "geojson",
        data: geojson
      });
    } else {
      map.getSource("geoboard-points").setData(geojson);
    }

    buildFeatureList(geojson.features);

    if (geojson.features.length > 0) {
      const bounds = new mapboxgl.LngLatBounds();
      geojson.features.forEach(f => {
        const [lng, lat] = f.geometry.coordinates;
        bounds.extend([lng, lat]);
      });
      map.fitBounds(bounds, { padding: 60, maxZoom: 10 });
    }
  }

  // Initial load
  map.on("load", async () => {
    await applyDataset("demo");
    ensurePointLayer();
    buildFeatureList(demoDataset.features);
    setupCategoryFilters();
  });

  // 6. Style selector
  const styleSelect = document.getElementById("style-select");
  styleSelect.addEventListener("change", () => {
    const styleKey = styleSelect.value;
    const styleUrl = MAP_STYLES[styleKey] || MAP_STYLES.streets;

    map.setStyle(styleUrl);

    map.once("style.load", async () => {
      await applyDataset(currentDataset); // reload whatever dataset is active
      ensurePointLayer();                 // re-add the layer on the new style
    });
  });

  // 7. Dataset selector
  const datasetSelect = document.getElementById("dataset-select");
  datasetSelect.addEventListener("change", async () => {
    const key = datasetSelect.value;
    await applyDataset(key);
  });
</script>

</body>
</html>
